<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr =[38,29,70,60,50];
        let sum=0;
        for (let i=0; i<arr.length; i++){
            sum=sum + arr[i];
        }
        document.write("sum ="+sum);
        let mul=2;
        for(let i=0; i<arr.length; i++){
            mul=mul * arr[i];
         }
         document.write("Mul ="+mul);
    </script>
</body>
</html>
